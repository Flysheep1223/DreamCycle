[project]
name = "dreamcycle"
version = "0.3.0"
description = "HTML client for Seedream generation, evaluation and iterative improvement"
readme = "dreamcycle/README.md"
requires-python = ">=3.11"
dependencies = [
  "volcengine-ark-runtime==5.0.58",
  "python-dotenv>=1.0.1",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
  "Pillow>=10.4.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "rapidocr-onnxruntime>=1.4.0",
  "tos>=2.9.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dreamcycle*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["N999"]
